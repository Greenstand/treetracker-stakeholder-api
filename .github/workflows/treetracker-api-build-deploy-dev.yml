name: Service CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  project-directory: ./

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container: node:18-bullseye

    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgis/postgis
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    if: |
      !contains(github.event.head_commit.message, 'skip-ci')
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - name: npm clean install
        run: npm ci
        working-directory: ${{ env.project-directory }}
      - name: run ESLint
        run: npm run lint
        working-directory: ${{ env.project-directory }}
      - name: run migrate
        run: npm run migrate
        working-directory: ${{ env.project-directory }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres/postgres
      - name: run api tests
        run: npm run test
        working-directory: ${{ env.project-directory }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres/postgres

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: |
      !contains(github.event.head_commit.message, 'skip-ci') &&
      github.event_name == 'push' &&
      github.repository_owner == 'Greenstand'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: npm clean install
        run: npm ci
        working-directory: ${{ env.project-directory }}

      - run: npm i -g semantic-release @semantic-release/{git,exec,changelog}

      - name: Run semantic-release
        id: semantic-release
        run: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build snapshot and push on merge
        id: docker_build_release
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: docker/build-push-action@v2
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: greenstand/${{ github.event.repository.name }}:${{ steps.semantic-release.outputs.new-release-version }}

      - name: Install kustomize
        if: steps.semantic-release.outputs.new-release-published == 'true'
        run: curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash

      - name: Run kustomize
        if: steps.semantic-release.outputs.new-release-published == 'true'
        env:
          IMAGE_NAME: greenstand/${{ github.event.repository.name }}
          IMAGE_TAG: ${{ steps.semantic-release.outputs.new-release-version }}
        run: |
          cd deployment/overlays/development
          ../../../kustomize edit set image "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Install doctl for kubernetes
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        if: steps.semantic-release.outputs.new-release-published == 'true'
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DEV_CLUSTER_NAME }}

      - name: Deploy to dev cluster
        if: steps.semantic-release.outputs.new-release-published == 'true'
        run: |
          kustomize build deployment/overlays/development \
            | kubectl apply --wait -f -
        working-directory: ${{ env.project-directory }}

    outputs:
      bumped_version: ${{ steps.semantic-release.outputs.new-release-version }}
